<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ac4834"/></marker></defs><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><rect width="1600" height="1080" fill="#fff8ec"/><text x="64" y="63" font-size="18" fill="#ac4834" font-weight="700">AI / KARIMONO RACE</text><text x="64" y="124" font-size="40" fill="#263d34" font-weight="700">このゲームで使っているもの</text><text x="64" y="163" font-size="20" fill="#687269" font-weight="400">Sitesで提供される機能と、外部のAPI・写真サービスを分けて表示</text><path d="M64 187H1536" stroke="#dcd6c7"/><rect x="40" y="225" width="450" height="665" rx="20" fill="#f0ede2" stroke="#dcd6c7" stroke-width="1.4"/><text x="64" y="260" font-size="19" fill="#687269" font-weight="700">スマホ・PCのブラウザ</text><rect x="530" y="225" width="540" height="665" rx="20" fill="#e8eee2" stroke="#dcd6c7" stroke-width="1.4"/><text x="554" y="260" font-size="19" fill="#687269" font-weight="700">Sitesの中で使っている機能</text><rect x="1110" y="225" width="450" height="665" rx="20" fill="#f4e9e2" stroke="#dcd6c7" stroke-width="1.4"/><text x="1134" y="260" font-size="19" fill="#687269" font-weight="700">別途利用する外部サービス</text><rect x="65" y="290" width="400" height="235" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(87,312)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="28" height="22" rx="3"/><path d="M2 11h28M7 8h1m3 0h1M9 18l-3 3 3 3m14-6 3 3-3 3"/></g></svg></g><text x="143" y="337" font-size="23" fill="#263d34" font-weight="700">ゲームの画面</text><text x="89" y="377" font-size="19" fill="#687269" font-weight="400">HTML / CSS / JavaScript</text><text x="89" y="407" font-size="19" fill="#687269" font-weight="400">ホスト画面・参加画面・順位表示</text><text x="89" y="437" font-size="19" fill="#687269" font-weight="400">スマホだけでも利用可能</text><rect x="65" y="570" width="400" height="235" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(87,592)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="18" height="28" rx="3"/><path d="M13 6h6M14 26h4"/></g></svg></g><text x="143" y="617" font-size="23" fill="#263d34" font-weight="700">ブラウザの機能</text><text x="89" y="657" font-size="19" fill="#687269" font-weight="400">カメラで撮影 / 写真を縮小</text><text x="89" y="687" font-size="19" fill="#687269" font-weight="400">効果音 / 合格通知</text><text x="89" y="717" font-size="19" fill="#687269" font-weight="400">専用アプリのインストール不要</text><rect x="555" y="290" width="490" height="150" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(577,312)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25a7 7 0 010-14 9 9 0 0117-1 7.5 7.5 0 010 15z"/><path d="M15 13l-3 6h7l-3 6"/></g></svg></g><text x="633" y="337" font-size="23" fill="#263d34" font-weight="700">アプリの実行・公開</text><text x="579" y="377" font-size="19" fill="#687269" font-weight="400">TypeScriptのサーバー処理 / API</text><text x="579" y="407" font-size="19" fill="#687269" font-weight="400">サイトの公開・APIキーの安全な保管</text><rect x="555" y="475" width="490" height="150" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(577,497)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="5"/><path d="M4 7v18c0 7 24 7 24 0V7M4 16c0 7 24 7 24 0"/></g></svg></g><text x="633" y="522" font-size="23" fill="#263d34" font-weight="700">データベース</text><text x="579" y="562" font-size="19" fill="#687269" font-weight="400">部屋・参加者・お題・投稿を保存</text><text x="579" y="592" font-size="19" fill="#687269" font-weight="400">順位・合格イベント・判定待ちを管理</text><rect x="555" y="660" width="490" height="150" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(577,682)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="4"/><path d="M4 7l3 21c2 4 16 4 18 0l3-21M11 17h10m-10 5h7"/></g></svg></g><text x="633" y="707" font-size="23" fill="#263d34" font-weight="700">画像ストレージ</text><text x="579" y="747" font-size="19" fill="#687269" font-weight="400">提出写真と参考写真を保存</text><text x="579" y="777" font-size="19" fill="#687269" font-weight="400">提出写真は判定後に削除</text><rect x="1135" y="290" width="400" height="235" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(1157,312)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M27 2v6m-3-3h6"/></g></svg></g><text x="1213" y="337" font-size="23" fill="#263d34" font-weight="700">OpenAI API</text><text x="1159" y="377" font-size="19" fill="#687269" font-weight="400">Agents API：お題と条件を作る</text><text x="1159" y="407" font-size="19" fill="#687269" font-weight="400">Decisions API：写真を判定する</text><text x="1159" y="437" font-size="19" fill="#687269" font-weight="400">設定したAPIキーで呼び出す</text><rect x="1135" y="570" width="400" height="235" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(1157,592)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="24" rx="3"/><circle cx="10" cy="12" r="3"/><path d="M3 26l9-8 5 4 6-9 7 11"/></g></svg></g><text x="1213" y="617" font-size="23" fill="#263d34" font-weight="700">Wikimedia Commons</text><text x="1159" y="657" font-size="19" fill="#687269" font-weight="400">参考写真を検索・取得する</text><text x="1159" y="687" font-size="19" fill="#687269" font-weight="400">作者・出典・ライセンスを記録</text><text x="1159" y="717" font-size="19" fill="#687269" font-weight="400">Sites上の処理からアクセス</text><rect x="40" y="930" width="1520" height="110" rx="20" fill="#eee9db" stroke="#dcd6c7" stroke-width="1.4"/><text x="64" y="965" font-size="19" fill="#687269" font-weight="700">今回の利用形態</text><text x="65" y="1003" font-size="22" fill="#263d34" font-weight="400">サーバー・DB・画像保存はSitesの機能を利用。別途Cloudflareアカウントを接続して構築していません。</text></g></svg>