<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ac4834"/></marker></defs><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><rect width="1600" height="1080" fill="#fff8ec"/><text x="64" y="63" font-size="18" fill="#ac4834" font-weight="700">AI / KARIMONO RACE</text><text x="64" y="124" font-size="40" fill="#263d34" font-weight="700">このゲームを支える技術スタック</text><text x="64" y="163" font-size="20" fill="#687269" font-weight="400">公開版の実装を中心に、画面・API・データ・AI・公開基盤を整理</text><path d="M64 187H1536" stroke="#dcd6c7"/><rect x="64" y="226" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(86,248)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="28" height="22" rx="3"/><path d="M2 11h28M7 8h1m3 0h1M9 18l-3 3 3 3m14-6 3 3-3 3"/></g></svg></g><text x="142" y="273" font-size="23" fill="#263d34" font-weight="700">画面 / ブラウザ</text><text x="88" y="313" font-size="19" fill="#687269" font-weight="400">HTML + CSS + JavaScript（ES Modules）</text><text x="88" y="343" font-size="19" fill="#687269" font-weight="400">getUserMedia / Canvas / Web Audio</text><text x="88" y="373" font-size="19" fill="#687269" font-weight="400">ホスト・参加者ともスマホで利用可能</text><rect x="562" y="226" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(584,248)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25a7 7 0 010-14 9 9 0 0117-1 7.5 7.5 0 010 15z"/><path d="M15 13l-3 6h7l-3 6"/></g></svg></g><text x="640" y="273" font-size="23" fill="#263d34" font-weight="700">API / 実行環境</text><text x="586" y="313" font-size="19" fill="#687269" font-weight="400">Cloudflare Workers + TypeScript</text><text x="586" y="343" font-size="19" fill="#687269" font-weight="400">部屋・受付・順位・判定キューを処理</text><text x="586" y="373" font-size="19" fill="#687269" font-weight="400">HTTP API + 定期ポーリングで同期</text><rect x="1060" y="226" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(1082,248)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="5"/><path d="M4 7v18c0 7 24 7 24 0V7M4 16c0 7 24 7 24 0"/></g></svg></g><text x="1138" y="273" font-size="23" fill="#263d34" font-weight="700">データベース</text><text x="1084" y="313" font-size="19" fill="#687269" font-weight="400">Cloudflare D1（SQLiteベース）</text><text x="1084" y="343" font-size="19" fill="#687269" font-weight="400">Drizzleスキーマ / SQL migrations</text><text x="1084" y="373" font-size="19" fill="#687269" font-weight="400">部屋・参加者・投稿・順位・合格イベント</text><rect x="64" y="510" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(86,532)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="4"/><path d="M4 7l3 21c2 4 16 4 18 0l3-21M11 17h10m-10 5h7"/></g></svg></g><text x="142" y="557" font-size="23" fill="#263d34" font-weight="700">画像ストレージ</text><text x="88" y="597" font-size="19" fill="#687269" font-weight="400">Cloudflare R2</text><text x="88" y="627" font-size="19" fill="#687269" font-weight="400">提出写真を判定中だけ一時保管</text><text x="88" y="657" font-size="19" fill="#687269" font-weight="400">参考写真はラウンド単位で共有</text><rect x="562" y="510" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(584,532)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M27 2v6m-3-3h6"/></g></svg></g><text x="640" y="557" font-size="23" fill="#263d34" font-weight="700">AI / 参考写真</text><text x="586" y="597" font-size="19" fill="#687269" font-weight="400">OpenAI Agents API：お題と基準を生成</text><text x="586" y="627" font-size="19" fill="#687269" font-weight="400">OpenAI Decisions API：写真を判定</text><text x="586" y="657" font-size="19" fill="#687269" font-weight="400">gpt-6-luna / Wikimedia Commons</text><rect x="1060" y="510" width="476" height="254" rx="14" fill="#fffefa" stroke="#dcd6c7"/><g transform="translate(1082,532)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32"><g fill="none" stroke="#ac4834" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8l-8 8 8 8m12-16 8 8-8 8M19 3l-6 26"/></g></svg></g><text x="1138" y="557" font-size="23" fill="#263d34" font-weight="700">ビルド / 公開</text><text x="1084" y="597" font-size="19" fill="#687269" font-weight="400">Sitesで公開・実行時シークレット管理</text><text x="1084" y="627" font-size="19" fill="#687269" font-weight="400">Vinext / Vite / Wranglerのビルド統合</text><text x="1084" y="657" font-size="19" fill="#687269" font-weight="400">ゲーム画面は共通の静的HTML・JS資産</text><rect x="64" y="815" width="1472" height="160" rx="20" fill="#edeade" stroke="#dcd6c7" stroke-width="1.4"/><text x="88" y="850" font-size="19" fill="#687269" font-weight="700">ローカル開発環境（公開サーバーとは別）</text><text x="90" y="894" font-size="25" fill="#263d34" font-weight="700">Node.js 22+  /  Express 5  /  node:sqlite  /  SSE  /  sharp  /  qrcode</text><text x="90" y="936" font-size="20" fill="#687269" font-weight="400">apps/web を共用。公開版のデータはD1、提出画像はR2に保存します。</text><text x="64" y="1030" font-size="17" fill="#687269" font-weight="400">実装確認日：2026.10.18  •  役割を示すベクターアイコン  •  APIキーはサーバー