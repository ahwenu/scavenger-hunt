Object.entries(categories).forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;$('#category').append(o)});
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function link(text,path,download=false){const a=el('a',text);a.href=path;if(download)a.download=path.split('/').pop();return a}
function show(a){$('#modal-name').textContent=a.name;$('#modal-id').textContent=a.id+' · '+a.width+' × '+a.height+' px · source '+a.sourceRect.join(', ');$('#modal-cutout').src=a.file;$('#modal-original').src=a.originalCrop;$('#modal-note').textContent=a.notes||'元画像からの分割素材。';modal.showModal()}
function render(){const query=$('#search').value.toLowerCase(),category=$('#category').value,alpha=$('#alpha').checked;const items=manifest.assets.filter(a=>(!category||a.category===category)&&(!alpha||a.transparency)&&(!query||[a.id,a.name,a.notes,a.category].join(' ').toLowerCase().includes(query)));grid.replaceChildren();$('#stats').textContent=items.length+' / '+manifest.assetCount+' 素材 · キャラ/表情の共通キャンバス版15点と、全素材の元切り抜きも同梱';for(const a of items){const card=el('article',null,'card'),thumb=el('button',null,'thumb');thumb.style.width='100%';thumb.style.border=0;thumb.style.borderRadius=0;thumb.setAttribute('aria-label',a.name+'を比較表示');const img=el('img');img.src=a.file;img.alt=a.name;img.loading='lazy';thumb.append(img);thumb.onclick=()=>show(a);const info=el('div',null,'info');info.append(el('div',a.name,'name'),el('div',a.id,'id'));const meta=el('div',null,'meta');meta.append(el('span',a.width+' × '+a.height+' px','tag'),el('span',a.transparency?'透過PNG':'背景付き / 合成',a.transparency?'tag alpha':'tag'));info.append(meta,el('p',a.notes||'元画像から分割。','note'));const links=el('div',null,'links');links.append(link('PNG保存',a.file,true),link('元切り抜き',a.originalCrop,true));if(a.alignedFile)links.append(link('共通サイズ版',a.alignedFile,true));info.append(links);card.append(thumb,info);grid.append(card)}if(!items.length)grid.append(el('p','一致する素材はありません。','empty'))}
['#search','#category','#alpha'].forEach(s=>$(s).addEventListener('input',render));$('#backdrop').onclick=()=>{const dark=document.body.classList.toggle('dark');$('#backdrop').textContent=dark?'明色背景に切替':'暗色背景に切替';$('#backdrop').setAttribute('aria-pressed',String(dark))};$('#close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});render();
</script>
</html>
